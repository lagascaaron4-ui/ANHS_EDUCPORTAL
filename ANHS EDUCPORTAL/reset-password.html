<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ANHS EduPortal</title>
    <link rel="icon" href="anhs-removebg-preview.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
  <script src="js/api.js"></script>
  <style>
    /* Enhanced Color variables with gradients */
    :root{
      --primary: #1a6633;
      --primary-dark: #13522d;
      --secondary: #e0b34d;
      --secondary-dark: #c99e38;
      --accent: #8b5cf6;
      --light-bg: #f9fafb;
      --dark-text: #13522d;
      --light-text: #ffffff;
      --gray-medium: #6b7280;
      --gradient-primary: linear-gradient(135deg, #1a6633 0%, #2d8b4a 50%, #1a6633 100%);
      --gradient-secondary: linear-gradient(135deg, #e0b34d 0%, #f4c550 50%, #e0b34d 100%);
      --gradient-hero: linear-gradient(135deg, rgba(26,102,51,0.95) 0%, rgba(45,139,74,0.9) 50%, rgba(19,82,45,0.95) 100%);
      --shadow-elegant: 0 25px 50px -12px rgba(26, 102, 51, 0.25);
      --shadow-soft: 0 10px 25px -5px rgba(26, 102, 51, 0.1);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, rgba(26,102,51,0.05) 33%, rgba(224,179,77,0.1) 66%, #f1f5f9 100%);
      color: #13522d;
      overflow-x: hidden;
      scroll-behavior: smooth;
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    /* Elegant background pattern */
    body::before {
      content: '';
      background: linear-gradient(135deg, #f8fafc 0%, rgba(26,102,51,0.05) 33%, rgba(224,179,77,0.1) 66%, #f1f5f9 100%);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(circle at 25% 25%, rgba(26,102,51,0.03) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(224,179,77,0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    /* Smooth, elegant transitions */
    a, button, .card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Enhanced focus indicators for all interactive elements */
    button:focus,
    a:focus,
    input:focus,
    [tabindex]:focus {
      outline: 3px solid #1a6633;
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Ensure all buttons meet minimum touch target size */
    button {
      min-height: 44px;
      min-width: 44px;
    }

    /* Links should have sufficient touch targets */
    a {
      min-height: 44px;
      display: inline-block;
    }

    /* Form controls minimum height */
    input {
      min-height: 44px;
    }

    /* Modern reset container design */
    .reset-container {
      background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
      border-radius: 20px;
      box-shadow: var(--shadow-elegant);
      border: 1px solid rgba(26, 102, 51, 0.08);
      max-width: 500px;
      width: 100%;
      padding: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    .reset-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-primary);
    }

    .reset-container h1 {
      color: var(--dark-text);
      margin-bottom: 2rem;
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .reset-container h1::before {
      content: '🔐';
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--dark-text);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-medium);
      z-index: 1;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 3rem;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: white;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26, 102, 51, 0.1);
    }

    .password-strength {
      margin-top: 0.75rem;
      padding: 0.75rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
      text-align: center;
    }

    .password-strength.weak {
      background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
      color: #dc2626;
      border: 1px solid #fecaca;
      display: block;
    }

    .password-strength.medium {
      background: linear-gradient(135deg, #fefce8 0%, #fef3c7 100%);
      color: #d97706;
      border: 1px solid #fcd34d;
      display: block;
    }

    .password-strength.strong {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      color: #16a34a;
      border: 1px solid #bbf7d0;
      display: block;
    }

    .requirements {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--gray-medium);
      background: var(--light-bg);
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .requirement {
      padding: 0.25rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .requirement.met {
      color: #16a34a;
    }

    .requirement.met::before {
      content: '✓';
      color: #16a34a;
      font-weight: bold;
    }

    .requirement::before {
      content: '✗';
      color: #dc2626;
      font-weight: bold;
    }

    .btn {
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .btn-reset {
      width: 100%;
      padding: 0.875rem 2rem;
      background: var(--gradient-primary);
      color: white;
      box-shadow: var(--shadow-soft);
      margin-top: 1.5rem;
    }

    .btn-reset:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-elegant);
    }

    .btn-reset:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .message {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      display: none;
      font-weight: 500;
      text-align: center;
    }

    .message.success {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      color: #16a34a;
      border: 1px solid #bbf7d0;
      display: block;
    }

    .message.error {
      background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
      color: #dc2626;
      border: 1px solid #fecaca;
      display: block;
    }

    .back-link {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }

    .back-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .back-link a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .reset-container {
        margin: 1rem;
        padding: 2rem;
      }

      .reset-container h1 {
        font-size: 1.75rem;
      }
    }

    /* Dark mode toggle */
    .dark-mode-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1000;
    }

    .dark-mode-toggle button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: all 0.3s ease;
    }

    .dark-mode-toggle button:hover {
      background: var(--primary-dark);
      transform: scale(1.1);
    }

    /* Loading spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
    <!-- Skip Navigation Link -->
    <a href="#main-content" class="skip-link sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:bg-primary focus:text-white focus:px-4 focus:py-2 focus:rounded">Skip to main content</a>

    <!-- Dark mode toggle -->
    <div class="dark-mode-toggle">
        <button onclick="toggleDarkMode()" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
    </div>

    <main id="main-content">
  <div class="reset-container">
    <h1>Reset Password</h1>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon" aria-hidden="true"></i>
          <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            required
          >
        </div>
        <div id="strengthMeter" class="password-strength"></div>
        <div class="requirements" id="requirements"></div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon" aria-hidden="true"></i>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
          >
        </div>
      </div>

      <button type="submit" class="btn btn-reset" id="submitBtn">
        <span class="btn-text">Reset Password</span>
        <div class="btn-loader" style="display: none;">
          <div class="spinner"></div>
        </div>
      </button>
    </form>

    <div id="message" class="message"></div>

    <div class="back-link">
      <a href="login.html">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
        Back to Login
      </a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');
    const strengthMeter = document.getElementById('strengthMeter');
    const requirementsDiv = document.getElementById('requirements');

    // Get token and email from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = urlParams.get('email');

    if (!token || !email) {
      messageDiv.className = 'message error';
      messageDiv.textContent = '❌ Invalid reset link. Please request a new one.';
      form.style.display = 'none';
    }

    // Password strength checker
    const passwordRequirements = {
      length: { regex: /.{8,}/, text: 'At least 8 characters' },
      uppercase: { regex: /[A-Z]/, text: 'One uppercase letter' },
      lowercase: { regex: /[a-z]/, text: 'One lowercase letter' },
      number: { regex: /[0-9]/, text: 'One number' },
      special: { regex: /[!@#$%^&*]/, text: 'One special character (!@#$%^&*)' }
    };

    newPasswordInput.addEventListener('input', (e) => {
      const password = e.target.value;
      let strength = 0;
      let met = 0;

      // Clear requirements
      requirementsDiv.innerHTML = '';

      // Check each requirement
      for (const [key, req] of Object.entries(passwordRequirements)) {
        const isMet = req.regex.test(password);
        if (isMet) {
          strength += 20;
          met++;
        }

        const reqDiv = document.createElement('div');
        reqDiv.className = `requirement ${isMet ? 'met' : ''}`;
        reqDiv.textContent = req.text;
        requirementsDiv.appendChild(reqDiv);
      }

      // Update strength meter
      strengthMeter.textContent = '';
      if (password.length > 0) {
        if (strength <= 40) {
          strengthMeter.className = 'password-strength weak';
          strengthMeter.textContent = '⚠️ Weak password';
        } else if (strength <= 80) {
          strengthMeter.className = 'password-strength medium';
          strengthMeter.textContent = '⚡ Medium strength';
        } else {
          strengthMeter.className = 'password-strength strong';
          strengthMeter.textContent = '✓ Strong password';
        }
      }
    });

    // Handle form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      // Validation
      if (newPassword !== confirmPassword) {
        messageDiv.className = 'message error';
        messageDiv.textContent = '❌ Passwords do not match';
        return;
      }

      if (newPassword.length < 8) {
        messageDiv.className = 'message error';
        messageDiv.textContent = '❌ Password must be at least 8 characters';
        return;
      }

      // Show loading state
      const btnText = submitBtn.querySelector('.btn-text');
      const btnLoader = submitBtn.querySelector('.btn-loader');
      btnText.style.display = 'none';
      btnLoader.style.display = 'block';
      submitBtn.disabled = true;

      try {
        const response = await API.auth.resetPassword(email, token, newPassword);

        messageDiv.className = 'message success';
        messageDiv.textContent = '✓ Password reset successfully! Redirecting to login...';

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } catch (error) {
        messageDiv.className = 'message error';
        messageDiv.textContent = '❌ ' + (error.message || 'Failed to reset password');

        // Hide loading state
        btnText.style.display = 'block';
        btnLoader.style.display = 'none';
        submitBtn.disabled = false;
      }
    });

    // Dark mode toggle
    async function loadDarkModePreference() {
      if (!window.API || !API.preferences) return false;
      try {
        const data = await API.preferences.get();
        return !!data?.preferences?.darkMode;
      } catch (error) {
        return false;
      }
    }

    async function saveDarkModePreference(isDark) {
      if (!window.API || !API.preferences) return;
      try {
        const current = await API.preferences.get().catch(() => ({ preferences: {} }));
        const merged = Object.assign({}, current?.preferences || {}, { darkMode: isDark });
        await API.preferences.update(merged);
      } catch (error) {
        console.warn('Failed to save dark mode preference', error);
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      saveDarkModePreference(document.body.classList.contains('dark-mode'));
    }

    // Load user preferences
    document.addEventListener('DOMContentLoaded', () => {
      loadDarkModePreference().then((isDark) => {
        if (isDark) document.body.classList.add('dark-mode');
      });
    });
  </script>
</body>
</html>
